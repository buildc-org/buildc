[package]
name = "buildc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
common = { git = "https://github.com/buildc-org/common", rev = "d8bdd6ff1807296323a440e5909e857c41fb7543" }

# A local release build uses this profile, so it favours compile time over runtime performance.
[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
clap-markdown = "0.1.5"
insta = { version = "1.49.0", default-features = false, features = ["filters"] }
