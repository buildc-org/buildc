[changelog]
header = """
# Changelog

Each release's section is written from the typed subjects on `main`.
"""
body = """

{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% endfor %}
{% endfor %}"""
footer = """

## 0.6.48 and earlier

The history before 0.6.49 predates the typed pull request titles. The notes on
each GitHub release record what it changed.
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# The HTML comment prefix on each group name orders the changelog sections without showing a number.
commit_parsers = [
    { message = "^(fix|chore|build)\\(deps\\)", group = "<!-- 4 -->Dependencies" },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverts" },
    { message = ".", skip = true },
]
