[package]
name = "buildc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[dependencies]
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
common = { git = "https://github.com/buildc-org/common", rev = "c7e9c09e315173d59ea54d659148136a559dc937" }

# A local release build uses this profile, so it favours compile time over runtime performance.
[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
