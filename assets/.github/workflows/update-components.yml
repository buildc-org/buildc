---
name: Update components

on:
  schedule:
    - cron: '0 2 * * 1'  # buildc:schedule
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true

      - name: Move the remote components to their library versions
        run: |
          set -euo pipefail
          ./scripts/buildc.sh generate

      - name: Open or update the pull request
        run: |
          set -euo pipefail
          branch="update-components"
          title="chore(components): move the remote components to their library versions"
          if [ -z "$(git status --porcelain -- repo.lock.kdl generated .github)" ]; then
            echo "Every locked component matches its library version."
            exit 0
          fi
          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            echo "::error::The moved components change the generated workflows. The workflow token cannot push a change under .github/workflows. Run 'buildc generate' locally and push the result."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          paths=(generated .github)
          # git add refuses a pathspec that matches no file.
          # A lock that git tracks still matches after it is deleted.
          if [ -e repo.lock.kdl ] || git ls-files --error-unmatch -- repo.lock.kdl > /dev/null 2>&1; then
            paths+=(repo.lock.kdl)
          fi
          git add -A -- "${paths[@]}"
          git diff --cached -- repo.lock.kdl > "$RUNNER_TEMP/lock.diff"
          git commit -m "$title"
          git push -f origin "$branch"
          {
            echo "Automated by the update-components workflow. Each remote component below moved to the commit of its library version."
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/lock.diff"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/pr-body.md"
          elif ! gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::The branch ${branch} is pushed, and no pull request opened. Allow GitHub Actions to create pull requests under Settings, Actions, General, Workflow permissions."
            exit 1
          fi
          if [ -f .github/workflows/image-build.yml ]; then
            # A branch pushed with GITHUB_TOKEN starts no workflow run. The build is dispatched here.
            gh workflow run image-build.yml --ref "$branch"
          fi
