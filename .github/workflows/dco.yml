name: DCO

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  signed-off:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off by its author
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            want="Signed-off-by: $(git log -1 --format='%an <%ae>' "$sha")"
            trailers="$(git log -1 --format='%(trailers:key=Signed-off-by)' "$sha")"
            if grep -qxF "$want" <<< "$trailers"; then
              continue
            fi

            read -ra commit <<< "$(git rev-list --parents -n 1 "$sha")"
            parents=("${commit[@]:1}")
            # A two-parent merge commit with no conflict resolution adds no content.
            # The merge author need not add a sign-off.
            if [ "${#parents[@]}" -eq 2 ] &&
              merged="$(git merge-tree --write-tree "${parents[0]}" "${parents[1]}" 2>/dev/null)" &&
              [ "$merged" = "$(git rev-parse "${sha}^{tree}")" ]; then
              continue
            fi

            echo "::error::${sha} is not signed off by its author. Add '${want}' with 'git commit --amend -s' or 'git rebase --signoff'."
            missing=1
          done < <(git rev-list "$HEAD" --not "origin/${BASE_REF}")
          exit "$missing"
