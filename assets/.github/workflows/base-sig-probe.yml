---
name: Base image probe

on:
  schedule:
    - cron: '30 6 * * *'  # buildc:schedule
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v2.6.3'

      - name: Probe each base and correct its signature
        id: probe
        run: |
          set -euo pipefail

          plan="$(mktemp)"
          ./scripts/buildc.sh plan --json > "${plan}"

          reconcile="$(mktemp)"
          cat > "${reconcile}" <<'PYTHON'
          import os

          witness = {}
          for entry in os.environ["WITNESSES"].split():
              name, _, paths = entry.partition("=")
              witness[name] = paths.split(",")

          present = set(os.environ["MEASURED"].split())
          caps_were = os.environ["PROVIDES"].split()

          witnessed = {n for n, paths in witness.items() if any(p in present for p in paths)}
          caps = [c for c in caps_were if c not in witness or c in witnessed]
          caps += sorted(c for c in witnessed if c not in caps_were)

          said = []
          gone = [c for c in caps_were if c not in caps]
          came = [c for c in caps if c not in caps_were]
          if gone:
              said.append("`provides` should lose " + ", ".join(f"`{c}`" for c in gone))
          if came:
              said.append("`provides` should gain " + ", ".join(f"`{c}`" for c in came))
          print("; ".join(said))
          PYTHON

          memos="$(mktemp -d)"
          changed=""
          drifted=""
          while IFS='|' read -r image base recorded file component provides witnesses; do
            [ -n "${image}" ] || continue
            if cosign download signature "${base}" > /dev/null 2>&1; then
              actual="true"
              # The probe asks only whether the signature carries a certificate identity, so any signer is accepted.
              if cosign verify --certificate-identity-regexp='.*' \
                --certificate-oidc-issuer-regexp='.*' "${base}" > /dev/null 2>&1; then
                kind="signed, and the signature names its signer"
              else
                kind="signed, but the signature names no signer, so it can be verified only with a key obtained elsewhere"
              fi
            else
              actual="false"
              kind="unsigned"
            fi
            echo "${image}: ${base} is ${kind}, recorded as ${recorded}"
            if [ "${actual}" != "${recorded}" ]; then
              sed -i "s/signed #${recorded}/signed #${actual}/" "${file}"
              if ! grep -q "signed #${actual}" "${file}"; then
                echo "::error file=${file}::\`${image}\` writes no \`signed\` line for the probe to correct; add \`signed #${recorded}\` to its base entry" >&2
                exit 1
              fi
              echo "  corrected ${file}: signed #${recorded} -> #${actual}"
              changed="${changed}${changed:+, }\`${image}\` (\`${base}\`): \`signed #${recorded}\` to \`#${actual}\`"
            fi

            probe="$(tr ' ' '\n' <<< "${witnesses}" | cut -d= -f2 | tr ',' '\n' | sort -u \
              | tr '\n' ' ')"
            memo="${memos}/$(printf '%s %s' "${base}" "${probe}" | md5sum | cut -d' ' -f1)"
            if [ -f "${memo}" ]; then
              measured="$(cat "${memo}")"
            else
              measured="$(podman run --rm --env "PATHS=${probe}" "${base}" \
                sh -c 'for p in $PATHS; do [ -e "$p" ] && echo "$p"; done; true')"
              printf '%s\n' "${measured}" > "${memo}"
              podman rmi -f "${base}" > /dev/null 2>&1 || true
            fi

            drift="$(WITNESSES="${witnesses}" MEASURED="${measured}" \
              PROVIDES="${provides}" python3 "${reconcile}")"
            [ -n "${drift}" ] || continue
            echo "  ${drift}"
            drifted="${drifted}${drifted:+, }\`${image}\` (\`${component}\`): ${drift}"
          done < <(jq -r '.images[]
                | [.id, .base.image, (.base.signed | tostring), .file, .base.path,
                   (.base.provides | join(" ")),
                   (.base.witnesses | to_entries
                     | map(.key + "=" + (.value | join(","))) | join(" "))]
                | join("|")' "${plan}")

          if [ -n "${drifted}" ]; then
            echo "drift=${drifted}" >> "${GITHUB_OUTPUT}"
            echo "Base \`provides\` drift, which the library corrects: ${drifted}" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -z "${changed}" ]; then
            echo "every base matches its declared signature"
            exit 0
          fi
          {
            echo "changed=true"
            echo "summary=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the drift issue
        if: steps.probe.outputs.changed != 'true' && steps.probe.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.probe.outputs.drift }}
        run: |
          set -euo pipefail
          title="A base image no longer ships what its component declares"
          body="$(mktemp)"
          cat > "${body}" <<EOF
          The base probe measured \`provides\` drift: ${DRIFT}

          \`provides\` lives in the base component, which this workflow does not
          edit. A tracked base takes the library's correction through the
          component update workflow. An untracked base is this repository's own,
          so edit its \`manifest.kdl\`, or its definition in the image file, to
          match.
          EOF
          number="$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file "${body}"
            echo "updated issue #${number}"
          else
            gh issue create --title "${title}" --body-file "${body}"
          fi

      - name: Open or update the correction PR
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          DRIFT: ${{ steps.probe.outputs.drift }}
        run: |
          set -euo pipefail
          branch="base-declaration-status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          ./scripts/buildc.sh generate
          git add ./*.kdl generated
          git commit -m "Record what the base images carry" \
            -m "${SUMMARY}"
          git push --force origin "${branch}"

          if gh pr view "${branch}" --json number > /dev/null 2>&1; then
            echo "updated the open PR for ${branch}"
            exit 0
          fi

          body="$(mktemp)"
          printf '%s\n\n' "${SUMMARY}" > "${body}"
          if [ -n "${DRIFT}" ]; then
            printf "The probe also measured \`provides\` drift: %s\n\n" "${DRIFT}" >> "${body}"
          fi
          cat >> "${body}" <<'EOF'
          What a base declares about itself is maintained by
          [this workflow](.github/workflows/base-sig-probe.yml) rather than by
          hand, so this PR only makes the declaration match the image. Half the
          rows in the catalog are moving tags, which is why this is measured
          nightly rather than audited once.


          `signed` records whether the base publishes a cosign signature. It
          reaches no build arg and no layer, and the images this repository
          publishes are cosign signed either way. It does reach
          `generated/plan.json`, which is why this PR carries the regenerated
          file beside the manifest.

          A base that turned `#true` can have its FROM pull gated, which is the
          point of tracking it: add a `policy.json` and a `registries.d` entry
          on the builder so the pull is verified rather than trusted, and bake
          the base's public key into the image so `bootc` can verify the base
          layer at upgrade time. A base that turned `#false` was publishing
          signatures and has stopped, which is worth finding out about before
          merging.


          `provides` lives in the base component, which this workflow does not
          edit. A tracked base takes the library's correction through the
          component update workflow. An untracked base is this repository's own,
          so edit its `manifest.kdl`, or its definition in the image file, to
          match.

          A capability the base carries is one no component has to build, and
          `buildc check` refuses a component whose `requires` nothing declares. A
          claim that is *added* is the quieter direction: a component every one
          of whose `provides` the base now covers comes off the build with no
          diagnostic.

          `rechunking` is not measured, because no path witnesses it.
          EOF

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "What a base image declares has changed" \
            --body-file "${body}"
