[package]
name = "buildc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Reads the image files and the per-component manifest.kdl manifests"

[features]
fuzzing = ["dep:tempfile"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
quick-xml = "0.42.0"
tempfile = { version = "3.27.0", optional = true }
common = { git = "https://github.com/buildc-org/common", rev = "8f16bad0fdaaded30dd9eb0cf0b835dabbe20d63" }

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "warn"
dbg_macro = "deny"
excessive_nesting = "warn"
todo = "deny"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unreachable_pub = "warn"

# A local release build uses this profile, so it favours compile time over runtime performance.
[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
clap-markdown = "0.1.5"
# The rev matches the `common` dependency, so the tests and the tool share one crate.
common = { git = "https://github.com/buildc-org/common", rev = "8f16bad0fdaaded30dd9eb0cf0b835dabbe20d63", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false, features = ["filters"] }
