[package]
name = "buildc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[dependencies]
kdl = "6.3.4"
miette = { version = "7.6.0", features = ["fancy"] }

# A local release build uses this profile, so it favours compile time over runtime performance.
[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
panic = "abort"
strip = true
