[package]
name = "buildc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[features]
fuzzing = ["dep:tempfile"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
quick-xml = "0.42.0"
tempfile = { version = "3.27.0", optional = true }
common = { git = "https://github.com/buildc-org/common", rev = "108da36985d0462233ee058738cca0b0d1a1e7d5" }

# A local release build uses this profile, so it favours compile time over runtime performance.
[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/buildc-org/common", rev = "108da36985d0462233ee058738cca0b0d1a1e7d5", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false, features = ["filters"] }
